name: Deploy NaFF Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: naff-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NaFF branch
        uses: actions/checkout@v4
        with:
          ref: naff-final-web-2

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Reconstruct and verify NaFF v23
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat \
            naff-v23-payload/part1.txt \
            naff-v23-payload/part2.txt \
            naff-v23-payload/part3.txt \
            naff-v23-payload/part4.txt \
            naff-v23-payload/part5.txt \
            | tr -d '\r\n\t ' \
            | base64 --decode \
            | gzip --decompress \
            > _site/index.html

          expected='bceeb07cde79476fefd8baf8d68ede8363fa556f4a5b6c5e13fcfb10c4472d40'
          actual="$(sha256sum _site/index.html | awk '{print $1}')"
          echo "NaFF SHA-256: $actual"
          test "$actual" = "$expected"

          test -s _site/index.html
          grep -qi '<!doctype html' _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
