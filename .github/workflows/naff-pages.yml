name: Deploy NaFF Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: naff-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NaFF branch
        uses: actions/checkout@v4
        with:
          ref: naff-final-web-2

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare and verify NaFF v23
        shell: bash
        run: |
          set -euo pipefail
          expected='bceeb07cde79476fefd8baf8d68ede8363fa556f4a5b6c5e13fcfb10c4472d40'
          source='NaFF_v23_PUBLICAR.html'

          if [ ! -f "$source" ]; then
            echo 'ERROR: falta NaFF_v23_PUBLICAR.html en la rama naff-final-web-2.' >&2
            echo 'No se publicará ningún paquete parcial.' >&2
            exit 1
          fi

          actual="$(sha256sum "$source" | awk '{print $1}')"
          echo "NaFF SHA-256: $actual"
          test "$actual" = "$expected"

          mkdir -p _site
          cp "$source" _site/index.html
          test -s _site/index.html
          grep -qi '<!doctype html' _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Triggered after verified v23 upload.
