<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10171a"><title>NaFF · Cargando</title><style>html,body{margin:0;width:100%;height:100%;background:#10171a;color:#f4eee3;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{display:grid;place-items:center}.box{width:min(420px,84vw);text-align:center}.bar{height:4px;background:#26383e;overflow:hidden;margin:18px 0}.bar i{display:block;width:25%;height:100%;background:#e8a14e;animation:a 1.1s ease-in-out infinite alternate}@keyframes a{to{width:100%;background:#69c9bf}}small{color:#bbc6c1}#err{color:#ff9ba2;white-space:pre-wrap}</style></head><body><div class="box"><b>Preparando NaFF…</b><div class="bar"><i></i></div><small id="s">Verificando el juego</small><div id="err"></div></div><script>(async()=>{const base='https://raw.githubusercontent.com/alanusp/TrustGraph-Realtime-Fraud-Lab/naff-final-web-2/naff-v23-payload/';const files=['part1.txt','part2.txt','part3.txt','part4.txt','part5.txt'];const status=document.getElementById('s'),err=document.getElementById('err');try{status.textContent='Descargando el juego…';const rs=await Promise.all(files.map(async f=>{const r=await fetch(base+f,{cache:'force-cache'});if(!r.ok)throw new Error(f+': HTTP '+r.status);return r.text()}));status.textContent='Reconstruyendo…';const b64=rs.join('').replace(/\s/g,'');const bin=atob(b64);const gz=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)gz[i]=bin.charCodeAt(i);if(typeof DecompressionStream==='undefined')throw new Error('Este navegador no admite la descompresión necesaria. Prueba con una versión reciente de Chrome, Edge o Safari.');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([gz]).stream().pipeThrough(ds)).text();status.textContent='Verificando integridad…';const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(html));const hash=[...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('');const expected='bceeb07cde79476fefd8baf8d68ede8363fa556f4a5b6c5e13fcfb10c4472d40';if(hash!==expected)throw new Error('La comprobación de integridad no coincide.\nEsperado: '+expected+'\nRecibido: '+hash);status.textContent='Abriendo…';document.open();document.write(html);document.close()}catch(e){console.error(e);status.textContent='No se pudo abrir NaFF';err.textContent='\n'+(e&&e.message?e.message:String(e))}})();</script></body></html>
